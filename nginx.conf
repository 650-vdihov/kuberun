events {
    worker_connections 1024;
}

http {
    # Access your host machine's services
    # Use host.docker.internal to reach localhost on your PC
    
    upstream auth_service {
        server host.docker.internal:4001;
    }
    
    upstream activity_service {
        server host.docker.internal:4002;
    }
    
    server {
        listen 80;
        
        # Handle CORS for React Native
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }

        location /auth {
            rewrite ^/auth/?(.*)$ /$1 break;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /activity {
            rewrite ^/activity/?(.*)$ /$1 break;
            proxy_pass http://activity_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Health check endpoint
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}