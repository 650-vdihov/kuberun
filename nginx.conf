events {
    worker_connections 1024;
}

http {
    # Services are now running inside Docker network
    
    upstream auth_service {
        server auth-service:4001;
    }
    
    upstream activity_service {
        server activity-service:4002;
    }
    
    upstream clubs_service {
        server clubs-service:4003;
    }
    
    upstream leaderboards_service {
        server leaderboards-service:4004;
    }
    
    server {
        listen 80;
        
        # Handle CORS for React Native
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }

        location /auth {
            rewrite ^/auth/?(.*)$ /$1 break;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /activity {
            rewrite ^/activity/?(.*)$ /$1 break;
            proxy_pass http://activity_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /clubs {
            rewrite ^/clubs/?(.*)$ /$1 break;
            proxy_pass http://clubs_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /leaderboards {
            rewrite ^/leaderboards/?(.*)$ /$1 break;
            proxy_pass http://leaderboards_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Health check endpoint
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}