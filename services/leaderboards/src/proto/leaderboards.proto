syntax = "proto3";

package leaderboards;

service LeaderboardsService {
  rpc RecordRun (RecordRunRequest) returns (RecordRunResponse);
}

message RecordRunRequest {
  string run_id = 1;
  string user_id = 2;
  double distance = 3;        // in meters
  int32 duration = 4;         // in seconds
  double pace = 5;            // min/km
  double avg_speed = 6;       // km/h
  int32 calories = 7;
  string start_time = 8;      // ISO 8601 format
  string end_time = 9;        // ISO 8601 format
  string completed_at = 10;   // ISO 8601 format
}

message RecordRunResponse {
  bool success = 1;
  string message = 2;
}
