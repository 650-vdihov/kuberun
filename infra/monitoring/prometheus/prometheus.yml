global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Services running on the host machine (reachable from Docker via host.docker.internal)
  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4001"]

  - job_name: activity
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4002"]

  - job_name: users
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4009"]
