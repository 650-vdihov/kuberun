replicaCount: 1

image:
  repository: rabbitmq
  tag: 3.13-management-alpine
  pullPolicy: IfNotPresent

auth:
  username: user
  password: password

service:
  type: ClusterIP
  amqpPort: 5672
  managementPort: 15672

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
