apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx-config
  labels:
    app: api-gateway
    release: {{ .Release.Name }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        upstream auth_service {
            server {{ .Values.upstreams.auth.name }}:{{ .Values.upstreams.auth.port }};
        }
        
        upstream activity_service {
            server {{ .Values.upstreams.activity.name }}:{{ .Values.upstreams.activity.port }};
        }
        
        upstream clubs_service {
            server {{ .Values.upstreams.clubs.name }}:{{ .Values.upstreams.clubs.port }};
        }
        
        upstream leaderboards_service {
            server {{ .Values.upstreams.leaderboards.name }}:{{ .Values.upstreams.leaderboards.port }};
        }
        
        server {
            listen 80;
            
            # Handle CORS
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }

            location /auth {
                rewrite ^/auth/?(.*)$ /$1 break;
                proxy_pass http://auth_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            location /activity {
                rewrite ^/activity/?(.*)$ /$1 break;
                proxy_pass http://activity_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            location /clubs {
                rewrite ^/clubs/?(.*)$ /$1 break;
                proxy_pass http://clubs_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            location /leaderboards {
                rewrite ^/leaderboards/?(.*)$ /$1 break;
                proxy_pass http://leaderboards_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            location /health {
                access_log off;
                return 200 "OK";
                add_header Content-Type text/plain;
            }
        }
    }
