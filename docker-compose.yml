name: rso-app
services:
  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth-service
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://user:password@auth-db:5432/auth_db
      BETTER_AUTH_SECRET: CTR2s27sBkkyNKu3dLIv5KfjUwkrcG4g
      BETTER_AUTH_URL: http://localhost:4000/auth
      RESEND_API_KEY: re_HKF2TkB9_DweZYLBQWrUyBRNEZLYonRYg
      EMAIL_FROM: onboarding@resend.dev
      TRUSTED_ORIGINS: http://localhost:4000
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - microservices-net

  # Activity Service
  activity-service:
    build:
      context: .
      dockerfile: services/activity/Dockerfile
    container_name: activity-service
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://user:password@activity-db:5432/activity_db
      AUTH_SERVICE_URL: http://auth-service:4001
      TRUSTED_ORIGINS: http://localhost:4000
      RABBITMQ_URL: amqp://user:password@rabbitmq:5672
      READINESS_TIMEOUT_MS: 3000
      RABBITMQ_RUN_COMPLETED_QUEUE: run.completed
      RABBITMQ_RECONNECT_INTERVAL_MS: 10000
      RABBITMQ_CONNECTION_TIMEOUT_MS: 5000
      RABBITMQ_HEARTBEAT_SECONDS: 30
    depends_on:
      activity-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  # Clubs Service
  clubs-service:
    build:
      context: .
      dockerfile: services/clubs/Dockerfile
    container_name: clubs-service
    environment:
      PORT: 4003
      DATABASE_URL: postgresql://user:password@clubs-db:5432/clubs_db
      AUTH_SERVICE_URL: http://auth-service:4001
      TRUSTED_ORIGINS: http://localhost:4000
      READINESS_TIMEOUT_MS: 3000
    depends_on:
      clubs-db:
        condition: service_healthy
    networks:
      - microservices-net

  # Leaderboards Service
  leaderboards-service:
    build:
      context: .
      dockerfile: services/leaderboards/Dockerfile
    container_name: leaderboards-service
    environment:
      PORT: 4004
      ACTIVITY_DB_URL: postgresql://user:password@activity-db:5432/activity_db
      CLUBS_DB_URL: postgresql://user:password@clubs-db:5432/clubs_db
      AUTH_SERVICE_URL: http://auth-service:4001
      TRUSTED_ORIGINS: http://localhost:4000
      RABBITMQ_URL: amqp://user:password@rabbitmq:5672
      READINESS_TIMEOUT_MS: 3000
      RABBITMQ_RUN_COMPLETED_QUEUE: run.completed
      RABBITMQ_RECONNECT_INTERVAL_MS: 10000
      RABBITMQ_CONNECTION_TIMEOUT_MS: 5000
      RABBITMQ_HEARTBEAT_SECONDS: 30
    depends_on:
      activity-db:
        condition: service_healthy
      clubs-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  # Nginx API Gateway
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "4000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - activity-service
      - clubs-service
      - leaderboards-service
    networks:
      - microservices-net

  # RabbitMQ Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # RabbitMQ communication port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net
      
  # PostgreSQL for Auth Service
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # PostgreSQL for Activity Service
  activity-db:
    image: postgres:16-alpine
    container_name: activity-db
    environment:
      POSTGRES_DB: activity_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - activity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d activity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # PostgreSQL for Clubs Service
  clubs-db:
    image: postgres:16-alpine
    container_name: clubs-db
    environment:
      POSTGRES_DB: clubs_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5437:5432"
    volumes:
      - clubs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d clubs_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - microservices-net

  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - microservices-net

volumes:
  auth-db-data:
  activity-db-data:
  clubs-db-data:
  prometheus-data:
  grafana-data:

networks:
  microservices-net:
    driver: bridge
